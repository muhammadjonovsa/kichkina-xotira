<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#050008" />
  <title>404 💔</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      overflow: hidden;
      background:
        radial-gradient(110vmax 80vmax at 50% -15%, rgba(90, 10, 40, 0.3), transparent 60%),
        radial-gradient(70vmax 55vmax at 85% 110%, rgba(60, 12, 80, 0.18), transparent 55%),
        #050008;
      color: #f6e7ee;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }

    .bh {
      font-size: clamp(84px, 26vw, 150px); line-height: 1;
      filter: drop-shadow(0 0 34px rgba(255, 60, 110, 0.35));
      animation: bhPulse 2.4s ease-in-out infinite;
    }
    @keyframes bhPulse {
      0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.92; }
      14% { transform: scale(1.08) rotate(-1deg); }
      28% { transform: scale(1) rotate(-2deg); }
      42% { transform: scale(1.05) rotate(-3deg); opacity: 1; }
      60% { transform: scale(1) rotate(-2deg); }
    }

    h1 {
      margin-top: 22px;
      font-size: clamp(64px, 20vw, 130px);
      font-weight: 800; letter-spacing: 0.08em; line-height: 1;
      background: linear-gradient(180deg, #fff, #ffb3c7 45%, #ff3d6e);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 26px rgba(255, 61, 110, 0.45));
      animation: glitchShift 3.2s ease-in-out infinite;
    }
    @keyframes glitchShift {
      0%, 88%, 100% { transform: none; filter: drop-shadow(0 0 26px rgba(255,61,110,.45)); }
      90% { transform: translateX(-3px) skewX(2deg); filter: drop-shadow(3px 0 0 rgba(120,220,255,.35)) drop-shadow(0 0 20px rgba(255,61,110,.5)); }
      93% { transform: translateX(3px) skewX(-2deg); filter: drop-shadow(-3px 0 0 rgba(255,80,140,.4)); }
      96% { transform: none; }
    }

    .t1 { margin-top: 16px; font-size: clamp(1.05rem, 4.4vw, 1.4rem); font-weight: 300; color: #ffd1dc; }
    .t2 { margin-top: 12px; font-size: clamp(0.9rem, 3.4vw, 1rem); color: rgba(255, 209, 220, 0.62); font-weight: 300; }

    .fh { position: fixed; pointer-events: none; user-select: none; opacity: 0.5; animation: floatUp linear infinite; }
    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(-8deg); opacity: 0; }
      12% { opacity: var(--o, 0.5); }
      85% { opacity: var(--o, 0.5); }
      100% { transform: translateY(-14vh) rotate(10deg); opacity: 0; }
    }
    .fh:nth-child(1) { left: 6%;  font-size: 20px; --o:.45; animation-duration: 13s; animation-delay: -2s; }
    .fh:nth-child(2) { left: 16%; font-size: 14px; --o:.3;  animation-duration: 17s; animation-delay: -9s; }
    .fh:nth-child(3) { left: 27%; font-size: 24px; --o:.5;  animation-duration: 11s; animation-delay: -5s; }
    .fh:nth-child(4) { left: 41%; font-size: 15px; --o:.32; animation-duration: 19s; animation-delay: -12s; }
    .fh:nth-child(5) { left: 55%; font-size: 21px; --o:.42; animation-duration: 14s; animation-delay: -3s; }
    .fh:nth-child(6) { left: 67%; font-size: 13px; --o:.28; animation-duration: 21s; animation-delay: -16s; }
    .fh:nth-child(7) { left: 78%; font-size: 25px; --o:.5;  animation-duration: 12s; animation-delay: -7s; }
    .fh:nth-child(8) { left: 89%; font-size: 17px; --o:.36; animation-duration: 16s; animation-delay: -11s; }

    @media (prefers-reduced-motion: reduce) {
      .bh, h1, .fh { animation: none !important; }
      .fh { display: none; }
    }
  </style>
</head>
<body>

<span class="fh">💔</span><span class="fh">💔</span><span class="fh">💔</span><span class="fh">💔</span>
<span class="fh">💔</span><span class="fh">💔</span><span class="fh">💔</span><span class="fh">💔</span>

<main>
  <div class="bh">💔</div>
  <h1>404</h1>
  <p class="t1">Xato... yurak singan joyida 💔</p>
  <p class="t2">😔 Bu sahifa endi mavjud emas</p>
</main>

</body>
</html>
